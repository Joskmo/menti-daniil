name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Clean-volume container smoke test
        run: |
          docker build --tag menti-github-bridge:test .
          docker volume create menti-github-bridge-ci-data
          trap 'docker volume rm --force menti-github-bridge-ci-data' EXIT
          docker run --rm \
            --volume menti-github-bridge-ci-data:/data \
            --entrypoint python \
            menti-github-bridge:test \
            -c "from bridge.store import SQLiteStore; SQLiteStore('/data/smoke.db')"
